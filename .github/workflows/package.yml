name: Package GoldIdeas

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt

      - name: Run backend tests
        run: python server/test_pipeline.py

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run smoke flow
        run: python scripts/smoke_flow.py

      - name: Package release
        run: python scripts/package_release.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldideas-release
          path: release/goldideas-release.zip
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/goldideas-release.zip
